":"見送り"},{"level":"P3","name":"特定題材の丸暗記・長時間模擬","reason":"年度別実出題未確認かつ既存負荷高","risk":"縮小・見送り"}],"research":[["A","結論・最重要5項目","公式の4領域は作業・言語・数量・行動。予測題材の暗記ではなく、初見指示理解、相手との意見調整、失敗後の再参加、操作と修正、自然な言語表現を重点とする。合格確率や採点を推測しない。"],["B","情報源・Evidence Ledger","A＝学校公式、B＝年度と具体内容がある出版社・教室の再構成、C＝具体的受験体験、D＝一般傾向、E＝独自教材。B・Cの年度別実出題本文は十分照合できず、独立確認した具体出題事例は0件。E04〜E06は未確認と記録し出題なしとはしない。複数の公式説明は独立考査事例と数えない。"],["C","10年度の出題一覧","2017〜2026年度（2016〜2025年秋実施）の具体的な作業・言語・数量・行動の年度別課題はすべて未確認。2027年度は2026年秋実施予定で過去問実績なし。再現性・頻度の定量計測不能。"],["D","出題構造分析","推奨する能力モデルは導入→指示理解→選択→実行→つまずき→修正→他者との関係→終了。ただし各実出題に存在すると断定しない。指示保持・自己調整・相手への応答・素材を扱う力は領域横断的に転移し得る。"],["E","観察対象仮説","公式教育思想：発達尊重、本物との出会い、教科・総合・自治、主体性と共同性。課題で創造性を見る可能性もある一方、指示理解と操作技能の確認である可能性もある。主体性とはルールを無視することではなく、条件を理解して自分で考えること。非公開の配点・合格行動は不明。"],["F","2027年度の定性推定","公式4領域の実施は高。ただし制作、絵本聴取、共同制作、ルール変更等の具体形式は判断不能。題材予想に依存せず、複数の材料・説明・人との関わりで初見適応を育てる。"],["G","本人の強みと課題","本人固有の観察・課題仮説は非公開の家庭設定にのみ保持。一般論として、一度の観察・他校評価で能力や性格を断定せず、本人の強みを保護しながら別条件で再確認する。"],["H","優先順位","P1：他者調整／感情の立て直し／初見指示／作業の修正。P2：数量・自然な言語表現・手先。P3：難問大量演習・模範回答暗記・題材当て・高負荷模擬追加。練習が本人の好奇心を減らすなら縮小。"],["I","日別計画","10/13〜18 現状観察、10/19〜25 応用、10/26〜11/3 低負荷とする一般的な段階設計。個別講習・他校考査・家庭予定は公開データに含めない。予定の重なりは親が判断し、休息の日は任意の短い遊びを1つ示す。考査日が確定したら前日までを再計算。"],["J","家庭メニュー","M1〜M12の12件。それぞれ目的・材料・自然な導入・手順・観察・つまずき支援・転移・避ける介入・次回判断を表示。これらは実出題ではない。"],["K","観察と調整","Observation→Hypothesis→Intervention→Re-check。課題／本人の実際の行動／支援／次回確認を30秒で記録する。点数化せず、異なる材料で自主的に進められるか観察する。"],["L","限界と最終査読","年度別の実出題再構成は未達、国立市の桐朋学園小学校と調布市の桐朋小学校を混同しない、学校公式事実と仮説を分離、過去の一回評価で性格を固定しない。EEFの発達に適した支援知見を採用するが合格への効果は未検証。家族データは非公開、SSOTへの書き込みは行わない。"]],"sources":[{"name":"桐朋公式募集要項","url":"https://shogakko.toho.ac.jp/exam/exam_outline","level":"A"},{"name":"桐朋公式考査説明","url":"https://shogakko.toho.ac.jp/exam/about","level":"A"},{"name":"桐朋公式Q&A","url":"https://shogakko.toho.ac.jp/exam/qa","level":"A"},{"name":"桐朋の学校記事","url":"https://shogakko.toho.ac.jp/archives/38785","level":"A"},{"name":"EEF Early Years Evidence Store","url":"https://educationendowmentfoundation.org.uk/early-years/evidence-store","level":"研究"},{"name":"EEF Early Years Self-Regulation","url":"https://educationendowmentfoundation.org.uk/early-years/evidence-store/self-regulation-and-executive-function","level":"研究"}],"years":[2017,2018,2019,2020,2021,2022,2023,2024,2025,2026],"domainMatrix":[["作業","素材・道具の扱い、複数手順、構成、試行錯誤、安全","作業工程の指示理解→計画→操作→修正","実出題の手順ではない"],["言語","傾聴、語彙、意味理解、経験・理由の説明、確認","聞く→理解→自分の言葉で伝える","設問形式・時間は未確認"],["数量","比較、分類、対応、分配、規則性、条件変更","具体物を扱う→数量の関係を見出す→説明","具体物／ペーパーの比率不明"],["行動","共同参加、ルール、他者配慮、主張と譲歩、再参加","状況理解→参加→相手と調整→再参加","行動の外形から性格・採点を断定しない"]],"philosophy":[["本物との出会い・具体的体験","実物を試し、確認する","操作技能・指示の正確さが主眼かもしれない"],["発達を尊重する教育","自分の方法で理解・試行","結果の正確さ・速度が大きい可能性"],["主体性・自己決定","自分で考えて提案・修正","条件を守ることを重視する可能性"],["自治・他者との関わり","協働・相談・共同決定","ルール理解・傾聴が中心かもしれない"],["一人ひとりの表現の尊重","本人なりの理由・表現","基本技能や伝達の明確さを測る可能性"]],"predictions":[["何らかの作業課題","高（領域のみ）","公式「作業」区分","具体的な道具・制作内容不明","別素材での構成・修正"],["何らかの言語課題","高（領域のみ）","公式「言語」区分","具体的な聞き取り・応答形式不明","聞く→確かめる→自分の言葉で話す"],["何らかの数量課題","高（領域のみ）","公式「数量」区分","ペーパー・具体物形式不明","分配・比較・規則の転移"],["何らかの行動観察","高（領域のみ）","公式「行動」区分","集団構成・観察方式不明","相手との意見調整・再参加"],["複数条件を保持した実行","判断不能","複数領域へ転移","実出題での裏づけなし","生活での口頭指示"],["素材を使う自由制作","判断不能","学校理念との整合","指示通りの制作かもしれない","紙・箱・積み木での試行"],["共同制作","判断不能","自治理念との整合","集団形式の出題根拠なし","親子・友達との相談"],["途中ルール変更","判断不能","柔軟性の転移価値","年度別出題根拠なし","遊びのルール変更"],["絵本・物語の聞き取り","判断不能","言語領域との整合","題材・設問形式未確認","読み聞かせ後の対話"],["折り紙・ひも結びなど特定題材","判断不能","一般教材で見られる技能","桐朋の実出題と照合不能","操作技能全般を日常で"]],"redteam":[["年度別実出題の復元不足","Critical","出題頻度や題材への過適合","具体題材は未確認、横断能力を優先"],["桐朋学園小学校との混同","Critical","別校の過去問による誤対策","国立市の別校情報を実出題から除外"],["非公開採点基準を推定","Critical","演技的・不適切な対応を強いる","配点・合格行動を創作しない"],["他校の一度の評価を固定視","High","本人の強みを抑圧","学校間の評価差・当日状況を考慮"],["自己調整と従順さを混同","High","主体性の低下","自分と相手の意見を両立"],["既存講習・他校受験との負荷重複","High","疲労・拒否・親子関係の悪化","高負荷日は新規練習なし"],["研究効果と合格効果の混同","High","根拠のない練習量増加","幼児教育上の妥当性と合格効果を分離"],["古い日程・Gateを最新と誤認","High","受験手続きの実害","スナップショット時点を明示し正本再照合"]],"privacy":"public-generic-only; no personal data"};

<script>
(function(){'use strict';
var KEY='toho2027.family-learning.v1';
var app=document.getElementById('app'), tabs=document.getElementById('tabs');
var D=PUBLIC_DATA, FAMILY=BUILTIN_FAMILY, saved={records:[],examDate:'',family:null};
var healthToday='',view='today', chosen='', selDate='', filter='all', editId='', importMode='backup';
var storageOK=true, message='', exportText='';
function safeURL(s){return /^https:\/\/docs\.google\.com\//.test(String(s||''))?String(s):'#';}
function esc(s){return String(s===null||typeof s==='undefined'?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jst(){var n=new Date(Date.now()+9*3600000);return n.getUTCFullYear()+'-'+('0'+(n.getUTCMonth()+1)).slice(-2)+'-'+('0'+n.getUTCDate()).slice(-2);}
function dlabel(dt){return dt.slice(5).replace('-','/');}
function dom(s){return document.getElementById(s);}
function load(){try{var x=window.localStorage.getItem(KEY);if(x){var v=JSON.parse(x);if(v&&v.version===1&&Array.isArray(v.records)){saved.records=v.records.filter(validRecord);saved.examDate=/^2026-11-0[456]$/.test(v.examDate)?v.examDate:'';if(validFamily(v.family)){saved.family=v.family;}}}}catch(e){storageOK=false;}}
function validRecord(v){return v&&typeof v.id==='string'&&v.id.length<100&&/^2026-\d\d-\d\d$/.test(v.date)&&typeof v.menu==='string'&&findMenu(v.menu)&&typeof v.behavior==='string'&&v.behavior.length<=500&&['none','hint','together','pause'].indexOf(v.support)!==-1&&typeof v.next==='string'&&v.next.length<=250;}
function validFamily(v){if(!v||typeof v!=='object'||!isIsoDay(String(v.asOf||'').slice(0,10)))return false;
if(v.schema&&v.schema!=='toho2027-private-snapshot-v1')return false;
if(!Array.isArray(v.events)||v.events.length>149||!Array.isArray(v.profile)||v.profile.length>49||!Array.isArray(v.gates)||v.gates.length>149)return false;
if(v.sourceVerifiedAt&&(!isIsoDay(v.sourceVerifiedAt.slice(0,10))||dayDiff(v.sourceVerifiedAt.slice(0,10),jst())>0))return false;
for(var i=0;i<v.events.length;i++){var e=v.events[i];if(!e||!isIsoDay(e.date)||['heavy','exam','light','none'].indexOf(e.load)===-1||typeof e.title!=='string'||e.title.length>200)return false;}
for(var j=0;j<v.gates.length;j++){var g=v.gates[j];if(!g||!isIsoDay(g.date)||typeof g.title!=='string'||g.title.length>200)return false;}
if(v.examDate&& !/^2026-11-0[456]$/.test(v.examDate))return false;
if(v.schema==='toho2027-private-snapshot-v1'&&(!Array.isArray(v.verifiedDates)||v.verifiedDates.length>60||v.verifiedDates.some(function(x){return !isIsoDay(x);}) ))return false;
return JSON.stringify(v).length<200000;}

function family(){return saved.family||FAMILY;}
function save(){try{var text=JSON.stringify({version:1,records:saved.records,examDate:saved.examDate,family:saved.family});window.localStorage.setItem(KEY,text);if(window.localStorage.getItem(KEY)!==text)throw Error('保存後の照合失敗');storageOK=true;return true;}catch(e){storageOK=false;message='端末への保存と再取得が確認できません。記録のバックアップを安全に保管してください。';return false;}}
function findMenu(id){for(var i=0;i<D.menu.length;i++)if(D.menu[i].id===id)return D.menu[i];return null;}
function findDay(date){for(var i=0;i<D.days.length;i++)if(D.days[i].date===date)return D.days[i];return null;}
function eventFor(dt){var f=family(),a=[];if(f&&f.events){for(var i=0;i<f.events.length;i++)if(f.events[i].date===dt)a.push(f.events[i]);}return a;}
function isIsoDay(s){return /^2026-\d{2}-\d{2}$/.test(String(s||''));}
function dayDiff(a,b){return Math.floor((Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10))-Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)))/86400000);}
function snapshotStatus(dt){var f=family();if(!f)return {ok:false,reason:'家庭の予定ファイルは読み込まれていません。講習や考査など予定がある日は、親の判断で休んでください。'};
var checked=(f.sourceVerifiedAt||f.asOf||'').slice(0,10);
if(!isIsoDay(checked))return {ok:false,reason:'予定ファイルの確認時刻が不明です。予定がある日は、親の判断で休んでください。'};
